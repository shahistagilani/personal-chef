[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-chef"
version = "0.1.0"
description = "A personal chef agent that suggests recipes from available ingredients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[tool.setuptools.packages.find]
where = ["src"]